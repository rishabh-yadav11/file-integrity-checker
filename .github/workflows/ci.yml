name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (race) - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Unit tests with race detector
        run: go test -race ./... -timeout 10m
      - name: Race walk and watch packages
        run: go test -race ./internal/walk ./internal/watch -count=1
      - name: Fuzz baseline parser (seeds + 60s)
        run: go test ./internal/baseline -run FuzzLoad -fuzz FuzzLoad -fuzztime 60s
      - name: Coverage gate (85%)
        shell: bash
        run: |
          go test ./... -coverprofile=coverage.out -timeout 10m
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3+0}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t < 85.0) { print "coverage below 85%: " t; exit 1 } }'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Benchmark smoke (correctness + sanity, not timing gates)
        run: |
          go test ./internal/hash -run '^$' -bench . -benchtime 10x -count=1
          go test ./internal/watch -run '^$' -bench . -benchtime 10x -count=1

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Fuzz seed regression (no -fuzz flag)
        run: go test ./internal/baseline -run FuzzLoad -count=1
